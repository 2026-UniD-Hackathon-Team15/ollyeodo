spring:
  application:
    name: ollyeodo
  config:
    # 비밀값은 레포 루트의 .env(깃 제외)에서 읽는다. 파일이 없으면 무시한다.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    # 채팅(이미지·캡션 추출)만 쓴다. 나머지 OpenAI 모델은 꺼서 키 없이도 빌드·테스트가 돌게 한다.
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-5.6-luna}
          temperature: ${AI_TEMPERATURE:}
    retry:
      max-attempts: 1
  datasource:
    # SUPABASE_DB_URL이 없으면 H2 메모리 DB로 뜬다 (Supabase 없이 로컬 개발용)
    url: ${SUPABASE_DB_URL:jdbc:h2:mem:ollyeodo;MODE=PostgreSQL}
    username: ${SUPABASE_DB_USERNAME:sa}
    password: ${SUPABASE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update   # 해커톤용. 테이블 생성 직후 SQL 에디터에서 RLS를 켠다
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  # 배포 환경(Render 등)이 넘겨주는 PORT를 쓰고, 로컬은 8080
  port: ${PORT:8080}

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}   # 서버 환경변수에만. 프론트와 깃에 절대 넣지 않음
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:images}
    signed-url-expires-in: 3600

app:
  extraction:
    # 이미지 분석은 시간이 더 걸려도 꼼꼼하게 (개수·가려진 부분 추정). 호출 1번 제한시간
    timeout: ${AI_TIMEOUT:120s}
    image-reasoning-effort: ${AI_IMAGE_REASONING_EFFORT:high}
  storage:
    type: ${APP_STORAGE_TYPE:local}   # local(uploads/ 폴더) | supabase
