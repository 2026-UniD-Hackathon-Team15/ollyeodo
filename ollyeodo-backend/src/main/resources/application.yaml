spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-5.6-luna}
          temperature: ${AI_TEMPERATURE:}
    retry:
      max-attempts: 1
  application:
    name: ollyeodo
  datasource:
    url: jdbc:h2:mem:ollyeodo;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
